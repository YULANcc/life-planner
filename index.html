<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8">
<meta name="color-scheme" content="light">
<meta name="description" content="给低精力人群的生活规划台：定目标、拆到每天、一巴掌打卡、一周出图。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="规划台">
<title>生活规划台</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar">
  <h1 class="brand">生活规划台</h1>
  <nav class="tabs" id="tabs" aria-label="主导航">
    <button class="tab is-active" data-tab="plan">规划台</button>
    <button class="tab" data-tab="week">本周</button>
    <button class="tab" data-tab="review">复盘</button>
  </nav>
  <div class="tools">
    <button class="btn ghost sm" id="btnSeed">载入示例</button>
    <button class="btn ghost sm" id="btnSettings">设置</button>
    <button class="btn ghost sm" id="btnExport">导出</button>
    <button class="btn ghost sm" id="btnImport">导入</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden aria-hidden="true" tabindex="-1">
  </div>
</header>

<main id="main">

  <!-- 规划台 -->
  <section id="view-plan" class="view is-active" aria-label="规划台">
    <div class="section-head">
      <h2>目标<span class="sub">先定 3–5 个，再拆成每天能做的动作</span></h2>
      <div class="spacer"></div>
      <button class="btn primary" id="btnAddGoal">+ 新目标</button>
    </div>
    <div id="goalList"></div>
    <div id="planEmpty" class="empty">
      还没有目标。点右上角「+ 新目标」，或者先点「载入示例」看看完整效果。
    </div>
  </section>

  <!-- 本周 -->
  <section id="view-week" class="view" aria-label="本周排期">
    <div class="week-bar">
      <div class="week-nav">
        <button class="btn ghost icon" data-weeknav="prev" aria-label="上一周">‹</button>
        <span class="week-label" aria-live="polite"></span>
        <button class="btn ghost icon" data-weeknav="next" aria-label="下一周">›</button>
        <button class="btn ghost sm" data-weeknav="today">回到本周</button>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="btnTired">今天没电</button>
      <button class="btn primary" id="btnGenerate">生成本周排期</button>
    </div>
    <div id="weekGrid" class="week-grid" role="group" aria-label="这一周的排期表"></div>
  </section>

  <!-- 复盘 -->
  <section id="view-review" class="view" aria-label="周复盘">
    <div class="week-bar">
      <div class="week-nav">
        <button class="btn ghost icon" data-weeknav="prev" aria-label="上一周">‹</button>
        <span class="week-label" aria-live="polite"></span>
        <button class="btn ghost icon" data-weeknav="next" aria-label="下一周">›</button>
        <button class="btn ghost sm" data-weeknav="today">回到本周</button>
      </div>
    </div>
    <div id="reviewBody" aria-live="polite"></div>
  </section>

</main>

<!-- 目标 -->
<dialog id="dlgGoal" aria-labelledby="dlgGoalTitle">
  <h2 id="dlgGoalTitle">新目标</h2>
  <div class="field">
    <label for="goalTitle">目标名称</label>
    <input id="goalTitle" name="goalTitle" autocomplete="off" placeholder="例如：学韩语、读完一本书…">
  </div>
  <div class="field">
    <label for="goalType">类型</label>
    <select id="goalType" name="goalType"></select>
  </div>
  <div class="field">
    <label for="goalHorizon">预期周期（可留空）</label>
    <input id="goalHorizon" name="goalHorizon" autocomplete="off" placeholder="例如：8 周、长期…">
  </div>
  <div class="dlg-actions">
    <button class="btn ghost" data-close>取消</button>
    <button class="btn primary" id="goalSave">保存</button>
  </div>
</dialog>

<!-- 任务 -->
<dialog id="dlgTask" aria-labelledby="dlgTaskTitle">
  <h2 id="dlgTaskTitle">新任务</h2>
  <div class="field">
    <label for="taskTitle">任务名称</label>
    <input id="taskTitle" name="taskTitle" autocomplete="off" placeholder="例如：背 20 个单词…">
  </div>
  <div class="grid2">
    <div class="field">
      <label for="taskFullMin">完整版 · 时长（分钟）</label>
      <input id="taskFullMin" name="taskFullMin" type="number" inputmode="numeric" min="1" max="600" value="30">
    </div>
    <div class="field">
      <label for="taskFullEnergy">完整版 · 精力（1–5）</label>
      <input id="taskFullEnergy" name="taskFullEnergy" type="number" inputmode="numeric" min="1" max="5" value="3">
    </div>
    <div class="field">
      <label for="taskMiniMin">简版 · 时长（分钟）</label>
      <input id="taskMiniMin" name="taskMiniMin" type="number" inputmode="numeric" min="1" max="600" value="8">
    </div>
    <div class="field">
      <label for="taskMiniEnergy">简版 · 精力（1–5）</label>
      <input id="taskMiniEnergy" name="taskMiniEnergy" type="number" inputmode="numeric" min="1" max="5" value="1">
    </div>
  </div>
  <div class="field">
    <label for="taskRepeat">重复</label>
    <select id="taskRepeat" name="taskRepeat">
      <option value="daily">每天</option>
      <option value="weekdays">工作日（周一至周五）</option>
      <option value="custom">自定义</option>
    </select>
  </div>
  <div class="field" id="taskDaysWrap" hidden>
    <span class="field-label" id="taskDaysLabel">选哪几天</span>
    <div class="days" id="taskDays" role="group" aria-labelledby="taskDaysLabel"></div>
  </div>
  <div class="field">
    <label for="taskSlot">偏好时段</label>
    <select id="taskSlot" name="taskSlot">
      <option value="any">不限（自动找当天最空的时段）</option>
      <option value="morning">早</option>
      <option value="afternoon">午</option>
      <option value="evening">晚</option>
    </select>
  </div>
  <div class="dlg-actions">
    <button class="btn ghost" data-close>取消</button>
    <button class="btn primary" id="taskSave">保存</button>
  </div>
</dialog>

<!-- 添加到某个时段 -->
<dialog id="dlgPick" aria-labelledby="dlgPickTitle">
  <h2 id="dlgPickTitle">添加到这个时段</h2>
  <div id="pickList" class="pick-list"></div>
  <div class="dlg-actions">
    <button class="btn ghost" data-close>关闭</button>
  </div>
</dialog>

<!-- 设置 -->
<dialog id="dlgSettings" aria-labelledby="dlgSettingsTitle">
  <h2 id="dlgSettingsTitle">设置</h2>
  <div class="field">
    <span class="field-label" id="budgetLabel">每时段精力预算（低精力人群建议调小一点）</span>
    <div class="grid3" role="group" aria-labelledby="budgetLabel">
      <input id="budMorning" name="budMorning" type="number" inputmode="numeric" min="1" max="30" aria-label="早间精力预算">
      <input id="budAfternoon" name="budAfternoon" type="number" inputmode="numeric" min="1" max="30" aria-label="午间精力预算">
      <input id="budEvening" name="budEvening" type="number" inputmode="numeric" min="1" max="30" aria-label="晚间精力预算">
    </div>
    <div class="grid3 budget-hint" aria-hidden="true">
      <span>早</span><span>午</span><span>晚</span>
    </div>
  </div>
  <div class="field">
    <span class="field-label" id="typeLabel">任务类型（可自定义，默认：学习型 / 探索型 / 体验型）</span>
    <div id="typeList" class="type-list" role="group" aria-labelledby="typeLabel"></div>
    <div class="add-type">
      <input id="newTypeName" name="newTypeName" autocomplete="off" placeholder="新类型名称，例如：身体、社交…" aria-label="新类型名称">
      <input id="newTypeColor" name="newTypeColor" type="color" value="#a78bfa" aria-label="新类型颜色">
      <button class="btn ghost sm" id="btnAddType">添加</button>
    </div>
  </div>
  <div class="dlg-actions">
    <button class="btn ghost" data-close>取消</button>
    <button class="btn primary" id="settingsSave">保存</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
