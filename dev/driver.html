<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>driver</title>
<style>
body { margin: 0; font: 12px/1.65 ui-monospace, Consolas, monospace; background: #fff; color: #1A2029; }
#f { width: 1380px; height: 820px; border: 0; display: block; }
#out { padding: 12px 18px; white-space: pre-wrap; background: #EEF2F6; border-top: 1px solid #D3DBE4; margin: 0; }
</style></head>
<body>
<iframe id="f" src="../index.html?reset=1"></iframe>
<pre id="out">running…</pre>
<script>
var lines = [];
function say(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var f = document.getElementById('f');

(async function () {
  try {
    await new Promise(function (r) { f.onload = r; });
    var d = f.contentDocument, w = f.contentWindow;
    w.alert = function () {}; w.confirm = function () { return true; };

    say('① 清空数据后：目标卡 ' + d.querySelectorAll('.goal-group').length +
        ' 个；空状态提示可见 = ' + (!d.getElementById('planEmpty').hidden));

    d.getElementById('btnAddGoal').click();
    await sleep(40);
    say('② 点「+ 新目标」：弹窗已打开 = ' + d.getElementById('dlgGoal').open +
        '；可选类型 = ' + [].map.call(d.getElementById('goalType').options, function (o) { return o.textContent; }).join(' / '));

    d.getElementById('goalTitle').value = '每天练 20 分钟吉他';
    d.getElementById('goalHorizon').value = '12 周';
    d.getElementById('goalType').selectedIndex = 1;
    d.getElementById('goalSave').click();
    await sleep(60);

    var g = d.querySelectorAll('.goal-group');
    say('③ 保存目标后：目标卡 ' + g.length + ' 个，标题「' +
        g[0].querySelector('.goal-title').textContent + '」，类型「' +
        g[0].querySelector('.goal-type').textContent + '」');

    g[0].querySelector('[data-task-add]').click();
    await sleep(40);
    d.getElementById('taskTitle').value = '爬格子 15 分钟';
    d.getElementById('taskFullMin').value = 20;
    d.getElementById('taskFullEnergy').value = 2;
    d.getElementById('taskMiniMin').value = 5;
    d.getElementById('taskMiniEnergy').value = 1;

    var rp = d.getElementById('taskRepeat');
    rp.value = 'custom';
    rp.dispatchEvent(new w.Event('change'));
    await sleep(20);
    say('④ 重复选「自定义」：星期选择器出现 = ' + (!d.getElementById('taskDaysWrap').hidden));

    [].slice.call(d.querySelectorAll('#taskDays [data-day]'), 0, 3).forEach(function (b) { b.click(); });
    d.getElementById('taskSlot').value = 'evening';
    d.getElementById('taskSave').click();
    await sleep(60);
    say('⑤ 保存任务后：任务行 ' + d.querySelectorAll('.trow').length + ' 条，内容是 ' +
        d.querySelector('.trow').innerText.replace(/\s*\n\s*/g, ' / '));

    d.getElementById('btnGenerate').click();
    await sleep(90);
    d.querySelector('.tab[data-tab="week"]').click();
    await sleep(90);

    var cards = d.querySelectorAll('#weekGrid .task');
    var daysWith = [].filter.call(d.querySelectorAll('#weekGrid .wcol'), function (c) {
      return c.querySelectorAll('.task').length > 0;
    }).length;
    say('⑥ 生成本周排期：本周排了 ' + cards.length + ' 张卡，分布在 ' + daysWith + ' 天');

    d.querySelector('#weekGrid .task .task-btns [data-act="done"]').click();
    await sleep(60);
    say('⑦ 点第一张卡的「完成」：卡片类名变成 ' + d.querySelector('#weekGrid .task').className);

    d.querySelector('.tab[data-tab="plan"]').click();
    await sleep(70);
    say('⑧ 回到规划台：界面里只有我自建的内容，共 ' +
        d.querySelectorAll('.goal-group').length + ' 个目标 / ' +
        d.querySelectorAll('.trow').length + ' 个任务');
  } catch (e) {
    say('!! 出错：' + e.message);
  }
})();
</script>
</body></html>
