<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>drag-test</title>
<style>body{margin:0;font:12px/1.6 ui-monospace,Consolas,monospace;background:#fff;color:#16191F}
#f{width:1400px;height:760px;border:0;display:block}
#out{padding:12px 16px;white-space:pre-wrap;background:#EEF2F6;border-top:1px solid #CBD4DE;margin:0}
</style></head>
<body>
<iframe id="f" src="../index.html?reset=1&seed=1&tab=plan"></iframe>
<pre id="out">running…</pre>
<script>
var lines = [];
function say(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var f = document.getElementById('f');

function fire(target, type, y, w, x) {
  var e = new (w.PointerEvent)(type, {
    bubbles: true, cancelable: true, clientX: (x === undefined ? 20 : x), clientY: y,
    pointerId: 1, pointerType: 'mouse'
  });
  target.dispatchEvent(e);
}

function order(d) {
  return [].map.call(d.querySelectorAll('#goalList .trow'), function (r) {
    return r.querySelector('.tname').textContent;
  });
}

(async function () {
  try {
    await new Promise(function (r) { f.onload = r; });
    var d = f.contentDocument, w = f.contentWindow;
    var lastAlert = '';
    w.alert = function (m) { lastAlert = m; };
    w.confirm = function () { return true; };

    var g = d.getElementById('dlgGuide');
    if (g && g.open) g.querySelector('[data-close]').click();
    await sleep(60);

    say('初始顺序：' + order(d).join(' → '));

    // --- 拖动：把第 3 条拖到第 1 条前面 ---
    var rows = [].slice.call(d.querySelectorAll('#goalList .trow'));
    var src = rows[2];
    var dst = rows[0];
    var handle = src.querySelector('[data-drag]');
    var y0 = src.getBoundingClientRect().top + 12;
    var yTarget = dst.getBoundingClientRect().top + 2;
    say('拖动对象：「' + src.querySelector('.tname').textContent + '」');
    say('拖动前它前面有 ' + rows.indexOf(src) + ' 条');

    var xTarget = dst.getBoundingClientRect().left + 80;
    fire(handle, 'pointerdown', y0, w, xTarget);
    await sleep(30);
    say('按下后该行带上拖动样式 = ' + src.classList.contains('is-dragging'));
    fire(handle, 'pointermove', yTarget, w, xTarget);
    await sleep(40);
    fire(handle, 'pointermove', yTarget, w, xTarget);
    await sleep(40);
    fire(handle, 'pointerup', yTarget, w, xTarget);
    await sleep(120);

    var after = order(d);
    var movedName = src.querySelector('.tname').textContent;
    say('拖动后顺序：' + after.join(' → '));
    say('「' + movedName + '」现在排在第 ' + (after.indexOf(movedName) + 1) + ' 位');

    // --- 填满就停：把预算压到 1/1/1 再生成 ---
    d.getElementById('btnSettings').click();
    await sleep(60);
    d.getElementById('budMorning').value = 1;
    d.getElementById('budAfternoon').value = 1;
    d.getElementById('budEvening').value = 1;
    d.getElementById('settingsSave').click();
    await sleep(60);

    d.querySelector('.tab[data-tab="week"]').click();
    await sleep(100);
    d.getElementById('btnGenerate').click();
    await sleep(140);
    say('把预算压到 1/1/1 后生成 → 弹窗提示：「' + lastAlert + '」');
    say('本周实际排进去 ' + d.querySelectorAll('#weekGrid .task').length + ' 张卡');

    // --- 恢复预算再生成，验证全部装得下 ---
    d.querySelector('.tab[data-tab="plan"]').click();
    await sleep(60);
    d.getElementById('btnSettings').click();
    await sleep(60);
    d.getElementById('budMorning').value = 3;
    d.getElementById('budAfternoon').value = 3;
    d.getElementById('budEvening').value = 2;
    d.getElementById('settingsSave').click();
    await sleep(60);
    d.querySelector('.tab[data-tab="week"]').click();
    await sleep(100);
    d.getElementById('btnGenerate').click();
    await sleep(140);
    say('恢复预算 3/3/2 后生成 → 弹窗提示：「' + lastAlert + '」');
    say('本周排入 ' + d.querySelectorAll('#weekGrid .task').length + ' 张卡');
  } catch (e) {
    say('!! 出错：' + e.message);
  }
})();
</script>
</body></html>
